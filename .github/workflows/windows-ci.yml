# Checks the Windows runtime: clang compiles the checked-in seed IR with the Windows runtime into
# nlc-selfhost.exe, which rebuilds itself (the IR must be identical to the seed), runs the PowerShell
# driver and builds and runs the c_runtime test programs.
name: windows-ci

on:
  workflow_dispatch:
  pull_request:
    paths: ["runtime/**", "seed/**", "scripts/nlc.ps1", ".github/workflows/windows-ci.yml"]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings (the seed was built from LF sources)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Build nlc-selfhost.exe from the seed IR
        shell: pwsh
        run: |
          python -c "import gzip,shutil; shutil.copyfileobj(gzip.open('seed/seed.ll.gz','rb'), open('seed.ll','wb'))"
          clang -O1 -DNLC_STACK_MODE_OFFSET=1 -D_CRT_SECURE_NO_WARNINGS -fuse-ld=lld -o nlc-selfhost.exe seed.ll runtime/nl_runtime.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The compiler rebuilds itself (IR identical to the seed)
        shell: pwsh
        run: |
          ./nlc-selfhost.exe build selfhost -o self.ll --runtime=c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = (Get-FileHash seed.ll).Hash
          $b = (Get-FileHash self.ll).Hash
          if ($a -ne $b) {
            python -c "a=open('seed.ll','rb').read().split(b'\n'); b=open('self.ll','rb').read().split(b'\n'); i=next((i for i in range(min(len(a),len(b))) if a[i]!=b[i]), None); print('first difference at line', i, 'of', len(a), len(b))"
            Write-Error "IR differs from the seed"; exit 1
          }
      - name: The PowerShell driver builds and runs a program
        shell: pwsh
        run: |
          $env:NLC_SELFHOST = (Resolve-Path nlc-selfhost.exe).Path
          $out = (./scripts/nlc.ps1 run tests/c_runtime/pools) -join "`n"
          $want = (Get-Content tests/c_runtime/pools/expected.stdout -Raw)
          if ($out.TrimEnd() -ne $want.TrimEnd()) { Write-Host $out; Write-Error "driver output differs"; exit 1 }
      - name: Build and run the c_runtime programs
        shell: pwsh
        run: |
          $failed = 0
          foreach ($dir in Get-ChildItem tests/c_runtime -Directory) {
            $name = $dir.Name
            ./nlc-selfhost.exe build "tests/c_runtime/$name" -o "$name.ll" --runtime=c
            clang -O1 -DNLC_STACK_MODE_OFFSET=1 -D_CRT_SECURE_NO_WARNINGS -fuse-ld=lld -o "$name.exe" "$name.ll" runtime/nl_runtime.c
            $out = (& "./$name.exe") -join "`n"
            $want = (Get-Content "tests/c_runtime/$name/expected.stdout" -Raw).TrimEnd("`r","`n")
            if ($out.TrimEnd("`r","`n") -ne $want) { Write-Host "FAIL $name"; $failed++ } else { Write-Host "ok $name" }
          }
          if ($failed) { exit 1 }

# Builds the Rust nlc (stage 0, used to build and drive clang) and the self-hosted compiler,
# tests them, and publishes the binaries as a GitHub Release. Manual only. Linux only: the
# runtimes use mmap, pthreads and signals; a Windows release waits for a Windows runtime.
name: stage0-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and release (it must already exist)"
        required: true
      run_tests:
        description: "Run the full test suite before publishing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Toolchain (Rust from rust-toolchain.toml; clang 18 as on the development machine)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          rustup show
          clang --version
          rustc --version

      - name: Build stage 0 (release)
        run: cargo build --release

      - name: Test
        if: ${{ inputs.run_tests }}
        run: |
          NLC_FRONTEND=rust cargo test --release
          NLC_FRONTEND=selfhost cargo test --release

      - name: Build the self-hosted compiler with stage 0
        run: ./target/release/nlc build selfhost -o selfhost-nlc

      - name: Self-hosted stage chain (the seed IR for other platforms)
        run: |
          ulimit -v 40000000
          python3 scripts/check-selfhost-stage-chain.py --reference target/release/nlc --opt-level 1 --output-dir stage-chain
          mkdir -p dist
          cp stage-chain/stage3.ll dist/seed.ll

      - name: Package
        run: |
          name="next-lang-${{ inputs.tag }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp dist/seed.ll "dist/$name/seed.ll"
          cp target/release/nlc "dist/$name/nlc-stage0"
          cp selfhost-nlc "dist/$name/nlc-selfhost"
          cp -r runtime core "dist/$name/"
          {
            echo "tag: ${{ inputs.tag }}"
            echo "commit: $(git rev-parse HEAD)"
            rustc --version
            clang --version | head -1
            echo "runner: ubuntu-24.04"
          } > "dist/$name/BUILD-INFO.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          sha256sum "dist/$name.tar.gz" > "dist/$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: seed
          path: dist/seed.ll

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: seed
          path: seed
      - name: Build nlc-selfhost.exe from the seed IR
        shell: pwsh
        run: |
          clang -O1 -DNLC_STACK_MODE_OFFSET=1 -D_CRT_SECURE_NO_WARNINGS -fuse-ld=lld -o nlc-selfhost.exe seed/seed.ll runtime/nl_runtime.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: The compiler rebuilds itself (IR identical to the seed)
        shell: pwsh
        run: |
          ./nlc-selfhost.exe build selfhost -o self.ll --runtime=c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-FileHash seed/seed.ll).Hash -ne (Get-FileHash self.ll).Hash) { Write-Error "IR differs from the seed"; exit 1 }
      - name: Package
        shell: pwsh
        run: |
          $name = "next-lang-${{ inputs.tag }}-windows-x86_64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item nlc-selfhost.exe, seed/seed.ll "dist/$name/"
          Copy-Item runtime, core -Recurse "dist/$name/"
          @("tag: ${{ inputs.tag }}", "commit: $(git rev-parse HEAD)", (clang --version | Select-Object -First 1), "runner: windows-latest", "Windows build of the self-hosted compiler only (no Rust nlc); compile programs with nlc-selfhost.exe build <dir> -o out.ll --runtime=c, then clang out.ll runtime/nl_runtime.c.") | Set-Content "dist/$name/BUILD-INFO.txt"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Set-Content "dist/$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  publish:
    needs: [build, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* \
            --title "${{ inputs.tag }}" \
            --notes "Linux x86_64: Rust nlc (frozen stage 0), the self-hosted compiler (nlc-selfhost), both C runtimes and the core library. Windows x86_64: the self-hosted compiler (nlc-selfhost.exe) built from its own IR with the Windows runtime. Each archive has BUILD-INFO.txt with toolchain versions and seed.ll, the compiler's own LLVM IR."
